name: CI

on:
  push:
    branches: [main, spec-*]
  pull_request:
    branches: [main]

env:
  # Node 24 LTS, no 20. `jsdom@30` (el entorno de los tests del frontend) exige
  # `^22.22.2 || ^24.15.0 || >=26`, y su dependencia `undici@8` llama a
  # `util.markAsUncloneable`, que no existe en Node 20: el job del frontend
  # moria en `Test` con 6 "unhandled errors" y cero tests corridos.
  # La version esta fijada aca y en `.nvmrc` para que local y CI no diverjan.
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # `npm run typecheck`, no `npx tsc`: si `node_modules` llegara a faltar
        # (install fallido, cache corrupto), `npx` baja del registry el paquete
        # `tsc@2.0.4` -que no es TypeScript- y el typecheck "pasa" sin compilar
        # nada. Con el script de npm el paso falla en el primer comando.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  backend:
    name: Backend (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    # A nivel de job y no por paso. Repetirla paso por paso es justamente como
    # una variable nueva se propaga a todos los lugares menos a uno: al agregar
    # `directUrl` al datasource de Prisma (las migraciones no pueden ir por el
    # pooler, por el advisory lock) el CI se rompio con
    #
    #   error: Environment variable not found: DIRECT_URL.   (P1012)
    #
    # en `Run migrations`, y tardamos tres commits en notarlo.
    env:
      DATABASE_URL: postgresql://vinoteca:vinoteca@localhost:5432/vinoteca
      # Sin pooler. En el CI no hay pooler, pero Prisma exige que la variable
      # exista: `directUrl` no es opcional en el schema.
      DIRECT_URL: postgresql://vinoteca:vinoteca@localhost:5432/vinoteca
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vinoteca
          POSTGRES_PASSWORD: vinoteca
          POSTGRES_DB: vinoteca
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U vinoteca"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      # `db:deploy` = `prisma migrate deploy`, no `db:migrate` = `migrate dev`.
      # `migrate dev` abre un prompt interactivo y crea una base sombra: en un
      # runner sin TTY se cuelga o falla por un motivo que no tiene que ver con
      # el codigo. La version applied de las migraciones la decide el repo, no
      # el estado de la base.
      - name: Run migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Contexto en la **raiz**, no en `./backend`: el `Dockerfile` vive en la
      # raiz para que el contexto sea la raiz por definicion y ningun proveedor
      # de deploy necesite configurar un "root directory". Con `./backend` el
      # build falla sin encontrar el Dockerfile.
      - name: Build backend image
        run: docker build -t vinoteca-backend .

      - name: Build frontend image (placeholder)
        run: echo "Frontend Docker build would go here"