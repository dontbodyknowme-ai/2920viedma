services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vinoteca
      POSTGRES_PASSWORD: vinoteca
      POSTGRES_DB: vinoteca
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vinoteca']
      interval: 5s
      retries: 5

  backend:
    # El Dockerfile vive en la raiz del repo y el contexto tambien. Ver el
    # comentario de `Dockerfile`: es lo que hace que ningun proveedor de
    # deploy necesite un "root directory" configurado a mano.
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://vinoteca:vinoteca@db:5432/vinoteca
      # Default solo para desarrollo local. Produccion lo inyecta el deploy.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-de-al-menos-32-caracteres-xxxx}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://localhost:9000}
      STORAGE_BUCKET: wine-images
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadmin}
      # Obligatoria desde 005/T1: es la que devuelve `POST /api/upload` y la
      # que queda guardada en el vino. Con MinIO en local, la ruta publica de
      # la imagen.
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000/wine-images}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      CORS_ORIGIN: http://localhost:5173
    ports: ['3000:3000']

volumes:
  pgdata: